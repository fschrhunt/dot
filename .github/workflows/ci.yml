name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  Linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - run: ./x check
      - run: ./x smoke
      # The installer people run, against the latest release.
      - run: sh install.sh --dir "$RUNNER_TEMP/dot" && "$RUNNER_TEMP/dot/dot" --version
      - run: ./x bench
  macOS:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - run: ./x fmt --check
      - run: ./x lint
      - run: ./x test
      - run: ./x guard
      # The installer people run, against the latest release.
      - run: sh install.sh --dir "$RUNNER_TEMP/dot" && "$RUNNER_TEMP/dot/dot" --version
