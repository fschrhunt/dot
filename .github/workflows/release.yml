name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check the tag in the same way CI does
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go build ./...
          go test ./...
          ./scripts/guard.sh
          ./scripts/smoke.sh

  release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build release archives
        env:
          TAG: ${{ github.ref_name }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o dist/dot ./cmd/dot
              tar -czf "dist/dot_${TAG}_${os}_${arch}.tar.gz" -C dist dot
            done
          done
          rm dist/dot
          cd dist
          sha256sum dot_*.tar.gz > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS.txt --verify-tag --title "$TAG" --generate-notes
