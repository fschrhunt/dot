name: Links

on:
  schedule:
    - cron: "37 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Use a pinned, verified binary instead of recompiling lychee each week.
      - name: Install lychee
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-musl.tar.gz -o lychee.tar.gz
          echo '73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5  lychee.tar.gz' | sha256sum --check --strict
          mkdir -p lychee-bin
          tar -xzf lychee.tar.gz --strip-components=1 -C lychee-bin lychee-x86_64-unknown-linux-musl/lychee
          echo "$RUNNER_TEMP/lychee-bin" >> "$GITHUB_PATH"
      - name: Check external links
        run: ./x links
